<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify-PlayMusics/SignUp</title>
   <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="signup">
        <h2>Please sign in here..!</h2>
        <form class="signupform">
            <input type="email" placeholder="Enter your email" name="email" id="email">
            <input type="number" placeholder="Enter your number" name="number" id="number">
            <input type="password" placeholder="Enter your password" name="password" id="password">
            <input type="password" placeholder="Confirm your password" name="Confirm-password" id="confirm-password">
            <button type="submit">SignIn</button>
        </form>
    </div>
</body>
<script src="signup.js"></script>
</html>
