<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <title>Spotify-PlayMusics</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
</head>

<body>
    <div class="container flex overflow">
        <div class="left bg-black">
            <div class="closer">
                <img class="filter" src="./Images/close.svg" alt="">
            </div>
            <div class="home bg-gray m-1 p-1 rounded">
                <div class="logo">
                    <img class="filter" src="./Images/logo.svg" alt="logo">
                </div>
                <ul>
                    <li><img class="filter" src="./Images/home.svg" alt="home">Home</li>
                    <li><img class="filter" src="./Images/search.svg" alt="Search">Search</li>
                </ul>
            </div>
            <div class="library bg-gray m-1 p-1 rounded">
                <div class="heading">
                    <img class="filter" src="/Images/playlist.svg" alt="playlist">
                    <h2>Your Library</h2>
                </div>
                <div class="songList">
                    <ul>

                    </ul>
                </div>
                <div class="footer">
                    <div><a href=""><span>
                                Legal
                            </span></a></div>
                    <div><a href=""><span>
                                Privacy Center
                            </span></a></div>
                    <div><a href=""><span>
                                Privacy Policy
                            </span></a></div>
                    <div><a href=""><span>
                                Cookies
                            </span></a></div>
                    <div><a href=""><span>
                                About Ads
                            </span></a></div>
                    <div><a href=""><span>
                                Privacy Policy
                            </span></a></div>
                    <div><a href=""><span>
                                Accessibility
                            </span></a></div>
                </div>
            </div>
        </div>
        <div class="right bg-gray ">
            <div class="header">
                <div class="nav">
                    <img class="filter hamberg" src="./Images/hamberg.svg" alt="hamberg">
                    <img class="filter" src="./Images/left.svg" alt="rightarrow">
                    <img class="filter" src="./Images/right.svg" alt="leftarrow">
                </div>
                <div class="btns">
                    <button class="rounded"><a href="/Signup.html">SignUp</a></button>
                    <button class="rounded"><a href="/login.html">Login</a></button>
                </div>
            </div>
            <div class="spotifyPlaylist">
                <h3>Spotify Playlist</h3>
                <div class="cardContainer">
                </div>
                <div class="playbar">
                    <div class="playRoll">
                        <div class="circle">

                        </div>
                    </div>
                    <div class="songBar">
                        <div class="songName">SongName</div>
                        <div class="playButton">
                            <img id="previous" class="filter" src="./Images/prevsong.svg" alt="">
                            <img id="play" class="filter" src="./Images/playButton.svg" alt="">
                            <img id="next" class="filter" src="./Images/nextsong.svg" alt="">
                        </div>
                        <div class="songVal">
                            <div class="songTime">00:00/00:00
                            </div>
                            <div class="volume">
                                <img src="./Images/volume.svg" alt="">
                                <input type="range" min="0" max="100" value="50" name="" id="">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="Script.js"></script>
</body>
<script>
    const loggedIn = localStorage.getItem("loggedIn");
    if (!loggedIn) {
        // if no login flag, send user to login page
        window.location.href = "./login.html";
    }
</script>
</html>
